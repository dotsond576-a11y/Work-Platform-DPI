<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPI Teacher Training Calendar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2313294B'/%3E%3Crect x='20' y='28' width='60' height='52' rx='6' fill='%23fff'/%3E%3Crect x='20' y='28' width='60' height='14' rx='6' fill='%23E84A27'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
/* ========================= Design tokens ========================= */
:root{
  --blue-900:#0A1830;
  --blue-800:#13294B;
  --blue-700:#1B3A63;
  --blue-600:#2E5A88;
  --blue-400:#6B8CB8;
  --blue-100:#E8EEF6;
  --orange-700:#C43D1F;
  --orange-600:#E84A27;
  --orange-500:#F1793F;
  --orange-300:#F5A671;
  --orange-100:#FDEBE3;
  --bg:#F5F7FB;
  --card:#FFFFFF;
  --border:#E2E8F0;
  --text:#1A202C;
  --text-muted:#64748B;
  --text-faint:#98A5B8;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 1px 3px rgba(19,41,75,0.08), 0 1px 2px rgba(19,41,75,0.06);
  --shadow-md:0 8px 24px rgba(19,41,75,0.14);
  --font-heading:'Sora',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ========================= Layout ========================= */
#app{display:flex;flex-direction:column;height:100vh;}

header.app-header{
  position:relative;
  background:linear-gradient(120deg, var(--blue-900) 0%, var(--blue-800) 55%, var(--blue-700) 100%);
  color:#fff;
  padding:14px 24px;
  display:flex;
  align-items:center;
  gap:20px;
  border-bottom:3px solid var(--orange-600);
  overflow:hidden;
  flex-shrink:0;
}
header.app-header::after{
  content:'';
  position:absolute;
  top:-60px; right:-60px;
  width:260px;height:260px;
  background:radial-gradient(circle, rgba(232,74,39,0.35) 0%, rgba(232,74,39,0) 70%);
  pointer-events:none;
}
.brand{display:flex;align-items:center;gap:10px;z-index:1;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg, var(--orange-600), var(--orange-500));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-heading);font-weight:800;font-size:15px;color:#fff;
  flex-shrink:0;
}
#title-input, .title-text{
  font-family:var(--font-heading);
  font-weight:700;
  font-size:19px;
  color:#fff;
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  padding:4px 8px;
  min-width:120px;
}
#title-input:hover, .title-text:hover{border-color:rgba(255,255,255,0.35);}
#title-input:focus{outline:none;border-color:var(--orange-500);background:rgba(255,255,255,0.08);}
.title-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;}

.view-switcher{display:flex;gap:4px;background:rgba(255,255,255,0.08);padding:4px;border-radius:999px;z-index:1;}
.view-switcher button{
  border:none;background:transparent;color:rgba(255,255,255,0.8);
  padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px;
  transition:background .15s, color .15s;
}
.view-switcher button:hover{color:#fff;background:rgba(255,255,255,0.08);}
.view-switcher button.active{background:var(--orange-600);color:#fff;box-shadow:0 2px 8px rgba(232,74,39,0.5);}

.header-spacer{flex:1;}
.header-actions{display:flex;gap:8px;align-items:center;z-index:1;}
.btn-reset{
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);color:rgba(255,255,255,0.85);
  padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.02em;
}
.btn-reset:hover{background:rgba(255,255,255,0.18);color:#fff;}

.layout{flex:1;display:flex;min-height:0;}
.sidebar{
  width:250px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);
  padding:18px 14px;overflow-y:auto;
}
.upcoming-panel{
  width:270px;flex-shrink:0;background:var(--card);border-left:1px solid var(--border);
  padding:18px 16px;overflow-y:auto;
}
main#main-content{flex:1;overflow-y:auto;padding:22px 26px;min-width:0;display:flex;flex-direction:column;}

.section-label{
  font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-faint);margin:0 0 10px 2px;
}
.sidebar-section{margin-bottom:24px;}

.board-row{
  display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--radius-sm);
  cursor:pointer;margin-bottom:2px;transition:background .12s;
}
.board-row:hover{background:var(--blue-100);}
.board-row.active{background:var(--blue-800);color:#fff;}
.board-row.active .board-count{color:rgba(255,255,255,0.7);}
.board-row.active .board-actions button{color:rgba(255,255,255,0.75);}
.color-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,0.08);}
.board-name{flex:1;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.board-count{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);}
.board-actions{display:none;gap:4px;}
.board-row:hover .board-actions{display:flex;}
.board-actions button{border:none;background:none;color:var(--text-faint);font-size:13px;padding:2px 4px;border-radius:4px;}
.board-actions button:hover{color:var(--blue-800);background:rgba(0,0,0,0.06);}

.btn-add-board{
  width:100%;text-align:left;padding:9px 10px;border-radius:var(--radius-sm);border:1.5px dashed var(--border);
  background:transparent;color:var(--text-muted);font-weight:600;font-size:13px;margin-top:6px;
}
.btn-add-board:hover{border-color:var(--orange-500);color:var(--orange-600);background:var(--orange-100);}

.btn-reset-mini{
  width:100%;text-align:left;padding:9px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:transparent;color:var(--text-muted);font-weight:600;font-size:12.5px;margin-top:18px;
}
.btn-reset-mini:hover{border-color:#DC2626;color:#DC2626;}

/* Upcoming panel */
.upcoming-item{
  display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid var(--border);cursor:pointer;
}
.upcoming-item:last-child{border-bottom:none;}
.upcoming-item:hover .upcoming-title{color:var(--orange-600);}
.upcoming-date{
  font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--blue-800);
  background:var(--blue-100);border-radius:6px;padding:5px 6px;text-align:center;line-height:1.1;min-width:38px;
}
.upcoming-date .day{display:block;font-size:14px;}
.upcoming-body{flex:1;min-width:0;}
.upcoming-title{font-weight:600;font-size:13px;color:var(--text);transition:color .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.upcoming-board{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:5px;margin-top:2px;}
.empty-note{color:var(--text-faint);font-size:12.5px;padding:8px 2px;}

/* ========================= Buttons / forms ========================= */
.btn{
  border:1px solid var(--border);background:var(--card);color:var(--text);
  padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;transition:all .12s;
}
.btn:hover{border-color:var(--blue-600);color:var(--blue-800);}
.btn-primary{background:var(--orange-600);border-color:var(--orange-600);color:#fff;}
.btn-primary:hover{background:var(--orange-700);border-color:var(--orange-700);color:#fff;}
.btn-secondary{background:var(--blue-800);border-color:var(--blue-800);color:#fff;}
.btn-secondary:hover{background:var(--blue-900);border-color:var(--blue-900);color:#fff;}
.btn-danger{color:#DC2626;border-color:#FCA5A5;background:#FEF2F2;}
.btn-danger:hover{background:#FEE2E2;border-color:#DC2626;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-icon{width:30px;height:30px;padding:0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.toolbar .grow{flex:1;}
.page-title{font-family:var(--font-heading);font-weight:700;font-size:22px;margin:0;}

input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{
  border:1px solid var(--border);border-radius:8px;padding:9px 11px;background:#fff;color:var(--text);width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue-600);box-shadow:0 0 0 3px rgba(46,90,136,0.12);}
label{font-size:12.5px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:5px;}
.field{margin-bottom:14px;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}

/* ========================= Modal ========================= */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,20,40,0.45);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal{
  background:#fff;border-radius:16px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
  box-shadow:var(--shadow-md);
}
.modal.modal-wide{max-width:640px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-header h3{margin:0;font-family:var(--font-heading);font-size:17px;}
.modal-close{border:none;background:none;font-size:20px;color:var(--text-faint);line-height:1;padding:4px;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:20px 22px;}
.modal-footer{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.modal-footer .push-left{margin-right:auto;}

.color-palette{display:flex;flex-wrap:wrap;gap:8px;}
.color-swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.color-swatch.selected{border-color:var(--text);box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--text);}

/* ========================= Calendar ========================= */
.cal-nav{display:flex;align-items:center;gap:10px;}
.cal-month-label{font-family:var(--font-mono);font-weight:700;font-size:15px;min-width:170px;text-align:center;}
.calendar-view-wrap{display:flex;flex-direction:column;flex:1;min-height:0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,1fr);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--border);gap:1px;flex:1;min-height:0;}
.cal-dow{background:var(--blue-800);color:#fff;text-align:center;padding:8px 0;font-size:11px;font-weight:700;letter-spacing:.06em;font-family:var(--font-mono);}
.cal-cell{background:#fff;min-height:64px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative;overflow:hidden;}
.cal-cell:hover{background:#FAFBFF;}
.cal-cell.other-month{background:#F8FAFC;}
.cal-cell.other-month .cal-daynum{color:var(--text-faint);}
.cal-cell.today{outline:2px solid var(--orange-600);outline-offset:-2px;}
.cal-daynum{font-family:var(--font-mono);font-weight:700;font-size:12.5px;color:var(--text-muted);flex-shrink:0;}
.cal-cell.today .cal-daynum{color:var(--orange-600);}
.cal-chips{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;min-height:0;}
.cal-chip{
  font-size:11px;padding:3px 6px;border-radius:5px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;
}
.cal-chip:hover{filter:brightness(1.1);}

/* ========================= List view ========================= */
.list-month-header{font-family:var(--font-heading);font-weight:700;font-size:16px;margin:22px 0 8px;color:var(--blue-800);}
.list-month-header:first-child{margin-top:0;}
.list-row{
  display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:11px 14px;margin-bottom:7px;cursor:pointer;
}
.list-row:hover{border-color:var(--blue-600);box-shadow:var(--shadow);}
.list-date{font-family:var(--font-mono);font-weight:700;font-size:12.5px;color:var(--blue-800);width:auto;min-width:64px;flex-shrink:0;}
.list-title{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-board{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-shrink:0;}

/* ========================= Board (kanban) ========================= */
.board-columns{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding-bottom:12px;}
.kanban-col{
  background:#EEF1F7;border-radius:var(--radius);width:270px;flex-shrink:0;padding:12px;min-height:120px;
}
.kanban-col-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:0 2px;}
.kanban-col-title{font-family:var(--font-heading);font-weight:700;font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kanban-count{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);background:#fff;border-radius:999px;padding:2px 7px;}
.kanban-card{
  background:#fff;border-radius:9px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);border-left:4px solid var(--blue-800);
  cursor:grab;
}
.kanban-card:hover{box-shadow:var(--shadow-md);}
.kanban-card.dragging{opacity:.4;}
.kanban-card-title{font-weight:600;font-size:13px;margin-bottom:3px;}
.kanban-card-date{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);}
.kanban-col.dragover{outline:2px dashed var(--orange-500);outline-offset:-4px;}
.kanban-add{width:100%;background:transparent;border:1.5px dashed #C7CEDB;border-radius:8px;padding:8px;font-size:12.5px;color:var(--text-muted);font-weight:600;}
.kanban-add:hover{border-color:var(--orange-500);color:var(--orange-600);}

/* ========================= Data tables (attendance/budget) ========================= */
.data-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff;}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px;}
table.data-table th{
  background:var(--blue-800);color:#fff;text-align:left;padding:10px 12px;font-weight:600;font-size:12px;
  white-space:nowrap;position:sticky;top:0;
}
table.data-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.data-table tbody tr:hover{background:#FAFBFF;}
table.data-table input, table.data-table select{border:1px solid transparent;background:transparent;padding:6px 7px;border-radius:6px;width:100%;min-width:90px;}
table.data-table input:hover, table.data-table select:hover{border-color:var(--border);}
table.data-table input:focus, table.data-table select:focus{border-color:var(--blue-600);background:#fff;}
table.data-table tfoot td{font-weight:700;font-family:var(--font-mono);background:#F8FAFC;border-top:2px solid var(--border);}
.row-action{border:none;background:none;color:var(--text-faint);font-size:13px;padding:4px 6px;border-radius:6px;}
.row-action:hover{color:#DC2626;background:#FEF2F2;}

.two-col{display:flex;gap:20px;align-items:flex-start;min-height:0;}
.side-list{width:250px;flex-shrink:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:10px;}
.side-list-item{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;margin-bottom:2px;display:flex;justify-content:space-between;gap:6px;}
.side-list-item:hover{background:var(--blue-100);}
.side-list-item.active{background:var(--blue-800);color:#fff;}
.side-list-item .sub{font-weight:400;font-size:11px;color:var(--text-muted);font-family:var(--font-mono);}
.side-list-item.active .sub{color:rgba(255,255,255,0.7);}
.content-col{flex:1;min-width:0;}

.tabs{display:flex;gap:4px;background:#EEF1F7;padding:4px;border-radius:10px;width:fit-content;margin-bottom:16px;}
.tabs button{border:none;background:transparent;padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;color:var(--text-muted);}
.tabs button.active{background:#fff;color:var(--blue-800);box-shadow:var(--shadow);}

.stat-cards{display:flex;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;min-width:150px;flex:1;}
.stat-card .label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);}
.stat-card .value{font-family:var(--font-heading);font-size:22px;font-weight:700;margin-top:4px;}
.stat-card.income .value{color:var(--blue-800);}
.stat-card.expense .value{color:var(--orange-600);}
.stat-card.net .value{color:#0F8A5F;}

.chart-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
.chart-card h4{margin:0 0 14px;font-family:var(--font-heading);font-size:15px;}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:12px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-muted);}
.legend-swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty-state .big{font-size:32px;margin-bottom:8px;}

@media (max-width: 1100px){ .upcoming-panel{display:none !important;} }
@media (max-width: 780px){ .sidebar{display:none !important;} .two-col{flex-direction:column;} .side-list{width:100%;} }
</style>
</head>
<body>
<div id="app">
  <header class="app-header" id="app-header"></header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main id="main-content"></main>
    <aside class="upcoming-panel" id="upcoming-panel"></aside>
  </div>
</div>
<div id="modal-root"></div>
<input type="file" id="file-import-input" accept=".csv,.xlsx,.xls" style="display:none;">

<script>
(function(){
"use strict";

/* ============================================================
   Constants & defaults
   ============================================================ */

var HOLIDAYS_BOARD_ID = "board-holidays";

var DEFAULT_BOARDS = [

    { id: "evt-cs-workshop-1",    title: "CS Educator Workshop 1", date: "2026-09-18", boardId: "board-cs-educator", notes: "", attendeeIds: [], budgetItems: [] },
    { id: "evt-cs-workshop-2",    title: "CS Educator Workshop 2", date: "2026-11-13", boardId: "board-cs-educator", notes: "", attendeeIds: [], budgetItems: [] },
    { id: "evt-cs-workshop-3",    title: "CS Educator Workshop 3", date: "2027-02-12", boardId: "board-cs-educator", notes: "", attendeeIds: [], budgetItems: [] },
    { id: "evt-cs-workshop-4",    title: "CS Educator Workshop 4", date: "2027-04-16", boardId: "board-cs-educator", notes: "", attendeeIds: [], budgetItems: [] }
  ];
}

function defaultHolidayEvents(){
  return [

function seedHolidaysIfNeeded(s){
  if (s.holidaysSeeded) return s;

  if (!hasHolidaysBoard){
    s.boards.push({ id: HOLIDAYS_BOARD_ID, name: "Holidays", color: "#64748B" });

  var existingIds = {};
  s.events.forEach(function(e){ existingIds[e.id] = true; });
  defaultHolidayEvents().forEach(function(e){
    if (!existingIds[e.id]) s.events.push(e);
  });
  s.holidaysSeeded = true;
  return s;
}

/* ============================================================
   Persistence (with bootstrap defaults + retry-on-failure)
   ============================================================ */
function ensureDefaults(loaded){
  var d = defaultState();
  var merged = {};
  Object.keys(d).forEach(function(key){
    merged[key] = (loaded && loaded[key] !== undefined) ? loaded[key] : d[key];
  });
  return merged;
}

function migrateParticipant(p){
  if (p.firstName === undefined && p.lastName === undefined){
    var full = (p.name || "").trim();
    var parts = full.split(/\s+/).filter(Boolean);
    if (parts.length > 1){
      p.lastName = parts.pop();
      p.firstName = parts.join(" ");
    } else {
      p.firstName = full;
      p.lastName = "";
    }
  }
  if (p.firstName === undefined) p.firstName = "";
  if (p.lastName === undefined) p.lastName = "";
  delete p.name;
  return p;
}

function loadState(){
  var loaded = null;
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) loaded = JSON.parse(raw);
  }catch(err){
    console.error("Could not read saved data, falling back to defaults.", err);
    loaded = null;
  }
  var s = ensureDefaults(loaded);
  s.participants.forEach(migrateParticipant);
  if (loaded && loaded.holidaysSeeded === undefined){
    s.holidaysSeeded = false;
  }
  seedHolidaysIfNeeded(s);
  return s;
}

var saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ persist(state, 0); }, 150);
}
function persist(data, attempt){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(err){
    if (attempt < 3){
      setTimeout(function(){ persist(data, attempt + 1); }, 200 * Math.pow(2, attempt));
    } else {
      console.error("Failed to save data after multiple attempts.", err);
    }
  }
}

/* ============================================================
   Utilities
   ============================================================ */
function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
}
function esc(str){
  return String(str === null || str === undefined ? "" : str).replace(/[&<>"']/g, function(c){
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function attr(str){ return esc(str).replace(/`/g, "&#96;"); }
function todayISO(){
  var d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function parseISO(iso){
  var parts = (iso || "1970-01-01").split("-").map(Number);
  return new Date(parts[0], parts[1]-1, parts[2]);
}
function toISO(dateObj){ return dateObj.getFullYear() + "-" + pad(dateObj.getMonth()+1) + "-" + pad(dateObj.getDate()); }
var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtDateLong(iso){
  if (!iso) return "";
  var d = parseISO(iso);
  return MONTH_NAMES[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
}
function eventEndDate(e){ return (e.endDate && e.endDate > e.date) ? e.endDate : e.date; }
function isMultiDay(e){ return eventEndDate(e) !== e.date; }
function eventDateRangeLabel(e){
  if (!isMultiDay(e)) return fmtDateLong(e.date);
  var d1 = parseISO(e.date), d2 = parseISO(eventEndDate(e));
  if (d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth()){
    return MONTH_NAMES[d1.getMonth()] + " " + d1.getDate() + "–" + d2.getDate() + ", " + d1.getFullYear();
  }
  return fmtDateLong(e.date) + " – " + fmtDateLong(eventEndDate(e));
}
function eventDateShortLabel(e){
  if (!isMultiDay(e)) return MONTH_SHORT[parseISO(e.date).getMonth()].toUpperCase() + " " + pad(parseISO(e.date).getDate());
  var d1 = parseISO(e.date), d2 = parseISO(eventEndDate(e));
  return MONTH_SHORT[d1.getMonth()].toUpperCase() + " " + pad(d1.getDate()) + "–" + MONTH_SHORT[d2.getMonth()].toUpperCase() + " " + pad(d2.getDate());
}
function fmtMoney(n){
  n = Number(n) || 0;
  var sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function boardById(id){ return state.boards.find(function(b){ return b.id === id; }) || null; }
function boardColor(id){ var b = boardById(id); return b ? b.color : "#94A3B8"; }
function boardName(id){ var b = boardById(id); return b ? b.name : "Uncategorized"; }
function eventById(id){ return state.events.find(function(e){ return e.id === id; }); }
function participantById(id){ return state.participants.find(function(p){ return p.id === id; }); }
function fullName(p){ return ((p.firstName||"") + " " + (p.lastName||"")).trim() || "(Unnamed)"; }
function sortedParticipants(list){
  return list.slice().sort(function(a, b){
    var an = ((a.lastName||"") + " " + (a.firstName||"")).trim().toLowerCase();
    var bn = ((b.lastName||"") + " " + (b.firstName||"")).trim().toLowerCase();
    return an.localeCompare(bn);
  });
}
function sortedEvents(){ return state.events.slice().sort(function(a,b){ return (a.date || "").localeCompare(b.date || ""); }); }
function visibleEvents(){
  var list = sortedEvents();
  if (state.boardFilter === "uncategorized") return list.filter(function(e){ return !e.boardId || !boardById(e.boardId); });
  if (state.boardFilter) return list.filter(function(e){ return e.boardId === state.boardFilter; });
  return list;
}
function budgetTotals(ev){
  var income = 0, expense = 0;
  (ev.budgetItems || []).forEach(function(item){
    var amt = Number(item.amount) || 0;
    if (item.type === "Income") income += amt; else expense += amt;
  });
  return { income: income, expense: expense, net: income - expense };
}

/* ============================================================
   Calendar view
   ============================================================ */
function calendarViewHTML(){
  var cursor = state.calendarCursor || todayISO().slice(0,7);
  var parts = cursor.split("-").map(Number);
  var year = parts[0], month = parts[1]-1;
  var firstOfMonth = new Date(year, month, 1);
  var startOffset = firstOfMonth.getDay();
  var gridStart = new Date(year, month, 1 - startOffset);
  var gridStartISO = toISO(gridStart);
  var gridEndISO = toISO(new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + 41));
  var today = todayISO();
  var evByDate = {};
  visibleEvents().forEach(function(e){
    var rangeStart = e.date > gridStartISO ? e.date : gridStartISO;
    var rangeEnd = eventEndDate(e) < gridEndISO ? eventEndDate(e) : gridEndISO;
    if (rangeStart > rangeEnd) return;
    var cursor = parseISO(rangeStart);
    var endCursor = parseISO(rangeEnd);
    while (cursor <= endCursor){
      var iso = toISO(cursor);
      (evByDate[iso] = evByDate[iso] || []).push(e);
      cursor.setDate(cursor.getDate() + 1);
    }
  });

  var html = '<div class="calendar-view-wrap">';
  html += '<div class="toolbar">' +
    '<h2 class="page-title">Calendar</h2>' +
    '<div class="grow"></div>' +
    '<div class="cal-nav">' +
      '<button class="btn btn-icon" data-action="nav-month" data-dir="-1">&larr;</button>' +
      '<div class="cal-month-label">' + MONTH_NAMES[month] + ' ' + year + '</div>' +
      '<button class="btn btn-icon" data-action="nav-month" data-dir="1">&rarr;</button>' +
      '<button class="btn" data-action="nav-today">Today</button>' +
    '</div>' +
    '<button class="btn btn-primary" data-action="add-event" data-date="">+ New event</button>' +
  '</div>';

  html += '<div class="cal-grid">';
  DOW_SHORT.forEach(function(d){ html += '<div class="cal-dow">' + d + '</div>'; });
  for (var i = 0; i < 42; i++){
    var cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    var iso = toISO(cellDate);
    var otherMonth = cellDate.getMonth() !== month;
    var dayEvents = evByDate[iso] || [];
    html += '<div class="cal-cell ' + (otherMonth?"other-month":"") + ' ' + (iso===today?"today":"") + '" data-action="add-event" data-date="' + iso + '">' +
              '<div class="cal-daynum">' + cellDate.getDate() + '</div>' +
              '<div class="cal-chips">' +
                dayEvents.map(function(e){
                  return '<div class="cal-chip" style="background:' + boardColor(e.boardId) + '" data-action="edit-event" data-id="' + e.id + '" data-stop="1">' + esc(e.title) + '</div>';
                }).join("") +
              '</div>' +
            '</div>';
  }
  html += '</div>';
  html += '</div>';
  return html;
}

function wireBoardDnD(){
  var cards = document.querySelectorAll(".kanban-card");
  cards.forEach(function(card){
    card.addEventListener("dragstart", function(e){
      ui.dragEventId = card.getAttribute("data-event-id");
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", function(){ card.classList.remove("dragging"); });
  });
  var cols = document.querySelectorAll(".kanban-col");
  cols.forEach(function(col){
    col.addEventListener("dragover", function(e){ e.preventDefault(); col.classList.add("dragover"); });
    col.addEventListener("dragleave", function(){ col.classList.remove("dragover"); });
    col.addEventListener("drop", function(e){
      e.preventDefault();
      col.classList.remove("dragover");
      var boardId = col.getAttribute("data-board-col") || null;
      var ev = eventById(ui.dragEventId);
      if (ev){
        ev.boardId = boardId || null;
        saveState();
        render();
      }
    });
  });
}

function budgetChartsHTML(){
  var events = sortedEvents();
  var hasData = events.some(function(e){ return (e.budgetItems||[]).length; });
  if (!hasData) return emptyState("No budget data yet.", "Add line items to an event's budget to see charts here.");
  var html = '<div class="chart-card"><h4>Income vs. Expenses by Event</h4>' + barChartSVG(events) + '</div>';
  html += '<div class="chart-card"><h4>Expenses by Category</h4>' + donutChartSVG(events) + '</div>';
  return html;
}

function barChartSVG(events){
  var data = events.map(function(e){ var t = budgetTotals(e); return { name: e.title, income: t.income, expense: t.expense }; })
                    .filter(function(d){ return d.income || d.expense; });
  if (!data.length) return emptyState("No budget data yet.", "");
  var w = 720, h = 320, padL = 60, padB = 70, padT = 20, padR = 20;
  var chartW = w - padL - padR, chartH = h - padT - padB;
  var maxVal = Math.max.apply(null, data.map(function(d){ return Math.max(d.income, d.expense); }).concat([1]));
  var niceMax = Math.ceil(maxVal / 5) * 5 || 5;
  var groupW = chartW / data.length;
  var barW = Math.min(34, groupW / 3);
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;max-width:760px;" font-family="Inter, sans-serif">';
  for (var g = 0; g <= 4; g++){
    var gy = padT + chartH - (chartH * g / 4);
    var gval = niceMax * g / 4;
    svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w-padR) + '" y2="' + gy + '" stroke="#E2E8F0" stroke-width="1"/>';
    svg += '<text x="' + (padL-8) + '" y="' + (gy+4) + '" font-size="10" fill="#64748B" text-anchor="end">' + Math.round(gval).toLocaleString() + '</text>';
  }
  data.forEach(function(d, i){
    var cx = padL + groupW * i + groupW/2;
    var incH = (d.income / niceMax) * chartH;
    var expH = (d.expense / niceMax) * chartH;
    var ix = cx - barW - 3, ex = cx + 3;
    svg += '<rect x="' + ix + '" y="' + (padT+chartH-incH) + '" width="' + barW + '" height="' + incH + '" fill="#13294B" rx="3"/>';
    svg += '<rect x="' + ex + '" y="' + (padT+chartH-expH) + '" width="' + barW + '" height="' + expH + '" fill="#E84A27" rx="3"/>';
    var label = d.name.length > 14 ? d.name.slice(0,13) + "…" : d.name;
    svg += '<text x="' + cx + '" y="' + (padT+chartH+18) + '" font-size="10.5" fill="#1A202C" text-anchor="middle">' + esc(label) + '</text>';
  });
  svg += '<line x1="' + padL + '" y1="' + (padT+chartH) + '" x2="' + (w-padR) + '" y2="' + (padT+chartH) + '" stroke="#94A3B8" stroke-width="1.5"/>';
  svg += '</svg>';
  var legend = '<div class="legend">' +
    '<div class="legend-item"><span class="legend-swatch" style="background:#13294B"></span>Income</div>' +
    '<div class="legend-item"><span class="legend-swatch" style="background:#E84A27"></span>Expenses</div>' +
    '</div>';
  return svg + legend;
}

function donutChartSVG(events){
  var totals = {};
  events.forEach(function(e){
    (e.budgetItems||[]).forEach(function(item){
      if (item.type !== "Expense") return;
      var cat = (item.category || "").trim() || "Uncategorized";
      totals[cat] = (totals[cat] || 0) + (Number(item.amount) || 0);
    });
  });
  var cats = Object.keys(totals).filter(function(c){ return totals[c] > 0; }).sort(function(a,b){ return totals[b]-totals[a]; });
  if (!cats.length) return emptyState("No expense data yet.", "");
  var grand = cats.reduce(function(s,c){ return s + totals[c]; }, 0);
  var r = 80, cx = 110, cy = 110, circumference = 2 * Math.PI * r, strokeW = 34;
  var offset = 0;
  var svg = '<svg viewBox="0 0 220 220" style="width:220px;height:220px;flex-shrink:0;">' +
    '<g transform="rotate(-90 110 110)">';
  cats.forEach(function(cat, i){
    var frac = totals[cat] / grand;
    var dash = frac * circumference;
    var color = CATEGORY_PALETTE[i % CATEGORY_PALETTE.length];
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + strokeW + '" ' +
      'stroke-dasharray="' + dash + ' ' + (circumference-dash) + '" stroke-dashoffset="' + (-offset) + '"/>';
    offset += dash;
  });
  svg += '</g>';
  svg += '<text x="110" y="104" text-anchor="middle" font-size="12" fill="#64748B" font-family="JetBrains Mono, monospace">TOTAL</text>';
  svg += '<text x="110" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#1A202C" font-family="Sora, sans-serif">' + fmtMoney(grand) + '</text>';
  svg += '</svg>';
  var legend = '<div class="legend">';
  cats.forEach(function(cat, i){
    var pct = Math.round((totals[cat] / grand) * 100);
    legend += '<div class="legend-item"><span class="legend-swatch" style="background:' + CATEGORY_PALETTE[i % CATEGORY_PALETTE.length] + '"></span>' + esc(cat) + ' &mdash; ' + fmtMoney(totals[cat]) + ' (' + pct + '%)</div>';
  });
  legend += '</div>';
  return '<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">' + svg + '<div style="flex:1;min-width:200px;">' + legend + '</div></div>';
}

}

/* ============================================================
   Global click delegation
   ============================================================ */
function runAction(action, arg1, arg2){
  if (!ACTIONS[action]) return;
  try{
    ACTIONS[action](arg1, arg2);
  }catch(err){
    console.error("Action \"" + action + "\" failed:", err);
    document.getElementById("modal-root").innerHTML =
      '<div class="modal-overlay" data-action="close-modal-overlay">' +
        '<div class="modal" data-stop="1">' +
          '<div class="modal-header"><h3>Something went wrong</h3><button type="button" class="modal-close" data-action="close-modal">&times;</button></div>' +
          '<div class="modal-body"><p style="margin:0 0 10px;color:var(--text);line-height:1.5;">This action hit an unexpected error and did not complete:</p>' +
          '<pre style="white-space:pre-wrap;background:#F8FAFC;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;color:#DC2626;">' + esc(err && err.message ? err.message : String(err)) + '</pre></div>' +
          '<div class="modal-footer"><button type="button" class="btn btn-primary" data-action="close-modal">OK</button></div>' +
        '</div>' +
      '</div>';
  }
}

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  if (action === "close-modal-overlay"){ runAction(action, el, e); return; }
  if (el.tagName === "A") e.preventDefault();
  runAction(action, el, e);
});

document.addEventListener("submit", function(e){
  var form = e.target.closest("form[data-action]");
  if (!form) return;
  e.preventDefault();
  var action = form.getAttribute("data-action");
  runAction(action, form);
});

/* ============================================================
   Spreadsheet import
   ============================================================ */
var FIRSTNAME_HEADERS = ["firstname","fname","first"];
var LASTNAME_HEADERS = ["lastname","lname","last","surname"];
var NAME_HEADERS = ["name","fullname","participantname","teachername","attendeename"];
var SCHOOL_HEADERS = ["school","schoolname","district","organization","institution","site"];
var EMAIL_HEADERS = ["email","emailaddress"];
var IEIN_HEADERS = ["iein","ieinnumber","educatorid","illinoiseducatorid"];
var IGNORED_HEADERS = ["totalsessions","totalnumberofsessions","sessionsattended","sessioncount","numberofsessions","sessions"];

function normHeader(h){ return String(h||"").toLowerCase().trim().replace(/[^a-z0-9]/g, ""); }
function matchCanonical(h){
  var n = normHeader(h);
  if (FIRSTNAME_HEADERS.indexOf(n) !== -1) return "firstName";
  if (LASTNAME_HEADERS.indexOf(n) !== -1) return "lastName";
  if (NAME_HEADERS.indexOf(n) !== -1) return "name";
  if (SCHOOL_HEADERS.indexOf(n) !== -1) return "school";
  if (EMAIL_HEADERS.indexOf(n) !== -1) return "email";
  if (IEIN_HEADERS.indexOf(n) !== -1) return "iein";
  if (IGNORED_HEADERS.indexOf(n) !== -1) return "ignore";
  return null;
}

function parseCSV(text){
  var rows = [], row = [], field = "", inQuotes = false;
  for (var i = 0; i < text.length; i++){
    var c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ","){ row.push(field); field = ""; }
      else if (c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r"){ /* skip */ }
      else field += c;
    }
  }
  if (field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return !(r.length === 1 && r[0].trim() === ""); });
}

function importRows(headerRow, dataRows, targetSessionId){
  var mapping = headerRow.map(function(h){ return { header: String(h||"").trim(), canon: matchCanonical(h) }; });
  mapping.forEach(function(m){
    if (!m.canon && m.header){
      var exists = state.customFields.some(function(f){ return f.toLowerCase() === m.header.toLowerCase(); });
      if (!exists) state.customFields.push(m.header);
    }
  });
  var count = 0;
  dataRows.forEach(function(r){
    if (!r || r.every(function(c){ return String(c===undefined?"":c).trim() === ""; })) return;
    var rec = { firstName: "", lastName: "", name: "", school: "", email: "", iein: "", custom: {} };
    mapping.forEach(function(m, idx){
      var val = r[idx] !== undefined ? String(r[idx]).trim() : "";
      if (m.canon === "ignore"){ /* known field, not imported (e.g. a computed session count) */ }
      else if (m.canon) rec[m.canon] = val;
      else if (m.header) rec.custom[m.header] = val;
    });
    if (!rec.firstName && !rec.lastName && rec.name){
      var parts = rec.name.split(/\s+/).filter(Boolean);
      if (parts.length > 1){ rec.lastName = parts.pop(); rec.firstName = parts.join(" "); }
      else rec.firstName = rec.name;
    }
    if (!rec.firstName && !rec.lastName && !rec.email) return;
    var recFull = (rec.firstName + " " + rec.lastName).trim().toLowerCase();
    var existing = null;
    if (rec.email) existing = state.participants.find(function(p){ return p.email && p.email.toLowerCase() === rec.email.toLowerCase(); });
    if (!existing && recFull) existing = state.participants.find(function(p){ return fullName(p).toLowerCase() === recFull && (p.school||"").toLowerCase() === (rec.school||"").toLowerCase(); });
    var target;
    if (existing){
      if (rec.firstName) existing.firstName = rec.firstName;
      if (rec.lastName) existing.lastName = rec.lastName;
      if (rec.school) existing.school = rec.school;
      if (rec.email) existing.email = rec.email;
      if (rec.iein) existing.iein = rec.iein;
      existing.custom = existing.custom || {};
      Object.keys(rec.custom).forEach(function(k){ if (rec.custom[k]) existing.custom[k] = rec.custom[k]; });
      target = existing;
    } else {
      target = { id: uid(), firstName: rec.firstName, lastName: rec.lastName, school: rec.school, email: rec.email, iein: rec.iein, custom: rec.custom };
      state.participants.push(target);
    }
    if (targetSessionId){
      var ev = eventById(targetSessionId);
      if (ev){ ev.attendeeIds = ev.attendeeIds || []; if (ev.attendeeIds.indexOf(target.id) === -1) ev.attendeeIds.push(target.id); }
    }
    count++;
  });
  saveState(); render();
  alertModal("Imported " + count + " participant" + (count === 1 ? "" : "s") + ".", "Import complete");
}

function handleImportFile(file){
  var targetSessionId = (ui.attendanceSession && ui.attendanceSession !== "directory") ? ui.attendanceSession : null;
  var ext = file.name.split(".").pop().toLowerCase();
  if (ext === "csv"){
    var reader = new FileReader();
    reader.onload = function(e){
      var rows = parseCSV(e.target.result);
      if (!rows.length) return;
      importRows(rows[0], rows.slice(1), targetSessionId);
    };
    reader.readAsText(file);
  } else if (ext === "xlsx" || ext === "xls"){
    if (typeof XLSX === "undefined"){
      alertModal("The spreadsheet reader could not load (no internet connection?). Please use a CSV file instead.", "Import unavailable");
      return;
    }
    var reader2 = new FileReader();
    reader2.onload = function(e){
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, { type: "array" });
      var sheet = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
      if (!rows.length) return;
      importRows(rows[0], rows.slice(1), targetSessionId);
    };
    reader2.readAsArrayBuffer(file);
  } else {
    alertModal("Unsupported file type. Please upload a .csv, .xlsx, or .xls file.", "Import unavailable");
  }
}
document.getElementById("file-import-input").addEventListener("change", function(e){
  var file = e.target.files && e.target.files[0];
  if (file) handleImportFile(file);
});

function csvEscape(v){
  v = String(v === undefined || v === null ? "" : v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function downloadTemplate(){
  var headers = ["First Name","Last Name","School","Email","IEIN"].concat(state.customFields);
  var csv = headers.map(csvEscape).join(",") + "\n";
  var blob = new Blob([csv], { type: "text/csv" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "participant_template.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportParticipantsCSV(){
  var headers = ["First Name","Last Name","School","Email","IEIN"].concat(state.customFields).concat(["Total Sessions"]);
  var rows = [headers];
  sortedParticipants(state.participants).forEach(function(p){
    var sessionCount = state.events.filter(function(e){ return (e.attendeeIds||[]).indexOf(p.id) !== -1; }).length;
    var row = [p.firstName||"", p.lastName||"", p.school||"", p.email||"", p.iein||""];
    state.customFields.forEach(function(f){ row.push((p.custom && p.custom[f]) || ""); });
    row.push(sessionCount);
    rows.push(row);
  });
  var csv = rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\n");
  var blob = new Blob([csv], { type: "text/csv" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "participants_export.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
